<div class="block items-in-cart" data-bind="mageInit: {'collapsible':{'openedState': 'active', 'active': isItemsBlockExpanded()}}">
    <div class="title" data-role="title">
        <strong role="heading" aria-level="1">
            <translate args="maxCartItemsToDisplay" if="maxCartItemsToDisplay < getCartLineItemsCount()"></translate>
            <translate args="'of'" if="maxCartItemsToDisplay < getCartLineItemsCount()"></translate>
            <span data-bind="text: getCartSummaryItemsCount().toLocaleString(window.LOCALE)"></span>
            <translate args="'Item in Cart'" if="getCartSummaryItemsCount() === 1"></translate>
            <translate args="'Items in Cart'" if="getCartSummaryItemsCount() > 1"></translate>
        </strong>
    </div>
    <div class="content minicart-items" data-role="content">
        <div class="minicart-items-wrapper">
            <ol class="minicart-items">
                <each args="items()">
                    <li class="product-item">
                        <div class="product">
                            <each args="$parent.elems()" render=""></each>
                        </div>
                        <!-- ko if: $data.epp_plan_name -->
                        <div class="epp-checkout-plan"
                             style="display:flex;align-items:center;gap:6px;padding:4px 0 2px 0;">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80"
                                 width="13" height="17" style="flex-shrink:0;">
                                <path d="M32 2L4 14v24c0 18 12 32 28 38 16-6 28-20 28-38V14Z" fill="#0a3d6b"></path>
                                <path d="M32 8L10 18v20c0 14.5 10 26 22 31 12-5 22-16.5 22-31V18Z" fill="#0d5096"></path>
                                <polyline points="20,39 28,47 44,31" fill="none" stroke="#fff"
                                          stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></polyline>
                            </svg>
                            <span style="font-size:1.4rem;color:#0d4f8b;font-weight:600;line-height:1.3;"
                                  data-bind="text: $data.epp_plan_name"></span>
                        </div>
                        <!-- /ko -->
                        <!-- ko if: $data.delivery_date_label -->
                        <div class="delivery-checkout-label"
                             style="display:flex;align-items:center;gap:6px;padding:3px 0 2px 0;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                                 viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                                <rect x="1" y="3" width="15" height="13" rx="1"></rect>
                                <path d="M16 8h4l3 5v3h-7V8z"></path>
                                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                                <circle cx="18.5" cy="18.5" r="2.5"></circle>
                            </svg>
                            <span style="font-size:1.4rem;color:#444;line-height:1.3;"
                                  data-bind="text: $data.delivery_date_label"></span>
                        </div>
                        <!-- /ko -->
                    </li>
                </each>
            </ol>
        </div>
    </div>
    <div class="actions-toolbar" if="maxCartItemsToDisplay < getCartLineItemsCount()">
        <div class="secondary">
            <a class="action viewcart" data-bind="attr: {href: cartUrl}">
                <span data-bind="i18n: 'View and Edit Cart'"></span>
            </a>
        </div>
    </div>
</div>
